<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advent of Code — HTML/CSS logo</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #061a35;
    }

    /* Treat this element like a scalable, image-like logo. */
    .aoc-logo {
      container-type: inline-size;
      width: min(100%, 1200px);
      aspect-ratio: 1200 / 628;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #061a35;
      color: #00df24;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(8px, 1.7cqw, 20px);
      line-height: 1.42;
      text-align: center;
    }

    .aoc-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      white-space: nowrap;
      transform: translateY(-.2em);
    }

    .rays {
      color: #e7ed00;
      line-height: 1.35;
      margin-bottom: .35em;
      text-shadow: 0 0 .08em currentColor;
    }

    .ray { height: 1.35em; }
    .branches { line-height: 1.45; }
    .branch { min-height: 1.45em; }

    .g { color: #00df24; }
    .y { color: #e7ed00; text-shadow: 0 0 .08em currentColor; }
    .o { color: #ff8500; }
    .b { color: #087cff; }
    .r { color: #ff2020; }
    .base { color: #a7a7a7; margin-top: .35em; line-height: 1.45; }
    .title { color: #00df24; margin-top: 1.1em; font-size: 1.35em; }

    @media (prefers-reduced-motion: no-preference) {
      .aoc-logo { transition: filter 160ms ease; }
      .aoc-logo:hover { filter: brightness(1.08); }
    }
  </style>
</head>
<body>
  <div class="aoc-logo" role="img" aria-label="Advent of Code logo: a colourful symbol tree above green Advent of Code text">
    <div class="aoc-mark" aria-hidden="true">
      <div class="rays">
        <div class="ray">|</div>
        <div class="ray">\|/</div>
        <div class="ray"><span>--</span><span class="y">*</span><span>--</span></div>
      </div>

      <div class="branches">
        <div class="branch"><span class="g">&gt;</span><span class="o">O</span><span class="g">&lt;</span></div>
        <div class="branch"><span class="g">&gt;</span><span class="b">O</span><span class="g">&lt;&lt;&lt;</span></div>
        <div class="branch"><span class="g">&gt;&gt;</span><span class="o">O</span><span class="g">&gt;&gt;</span><span class="y">*</span><span class="g">&lt;</span></div>
        <div class="branch"><span class="g">&gt;</span><span class="o">O</span><span class="g">&lt;&lt;&lt;</span><span class="o">O</span><span class="g">&lt;&lt;&lt;</span></div>
        <div class="branch"><span class="g">&gt;&gt;</span><span class="r">@</span><span class="g">&gt;</span><span class="y">*</span><span class="g">&lt;&lt;</span><span class="b">O</span><span class="g">&lt;&lt;&lt;</span></div>
        <div class="branch"><span class="g">&gt;</span><span class="o">O</span><span class="g">&gt;&gt;</span><span class="r">@</span><span class="g">&gt;&gt;&gt;</span><span class="o">O</span><span class="g">&gt;</span><span class="o">O</span><span class="g">&lt;&lt;</span></div>
        <div class="branch"><span class="g">&gt;</span><span class="y">*</span><span class="g">&gt;&gt;</span><span class="y">*</span><span class="g">&lt;</span><span class="o">O</span><span class="g">&lt;</span><span class="r">@</span><span class="g">&lt;</span><span class="o">O</span><span class="g">&lt;&lt;&lt;</span></div>
        <div class="branch"><span class="g">&gt;</span><span class="o">O</span><span class="g">&gt;</span><span class="o">O</span><span class="g">&lt;&lt;&lt;</span><span class="b">O</span><span class="g">&lt;</span><span class="y">*</span><span class="g">&gt;&gt;</span><span class="y">*</span><span class="g">&gt;&gt;</span><span class="b">O</span><span class="g">&lt;</span></div>
      </div>

      <div class="base">_ &nbsp;__| &nbsp;|__ &nbsp;_</div>
      <div class="title">Advent of Code</div>
    </div>
  </div>
</body>
</html>
